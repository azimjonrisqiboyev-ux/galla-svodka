<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gʻalla Monitor — Toshkent viloyati</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sidebar-bg:   #1A3C2E;
  --sidebar-w:    56px;
  --sidebar-w-ex: 220px;
  --bg:           #F2F4F3;
  --white:        #FFFFFF;
  --border:       #E2E8E4;
  --border2:      #D0D8D3;
  --g900: #0F2A1E;
  --g700: #1A3C2E;
  --g500: #2E7A52;
  --g400: #3A9966;
  --g300: #5CB882;
  --g200: #A8D9BC;
  --g100: #D4EFE2;
  --g50:  #EDF7F2;
  --gold:  #E8963A;
  --red:   #DC4C4C;
  --blue:  #3A7BD5;
  --teal:  #2A9D8F;
  --txt:   #1A2E24;
  --txt2:  #4A6358;
  --txt3:  #7A9A8A;
  --r:  8px;
  --rl: 12px;
  --sh: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
  --shm: 0 4px 20px rgba(0,0,0,.1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 14px; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--txt); min-height: 100vh; display: flex; }

/* ══ SIDEBAR ══ */
.sidebar { width: var(--sidebar-w); min-height: 100vh; background: var(--sidebar-bg); position: fixed; top: 0; left: 0; display: flex; flex-direction: column; align-items: center; z-index: 200; transition: width .25s ease; overflow: hidden; }
.sidebar:hover { width: var(--sidebar-w-ex); }
.sb-logo { width: 100%; padding: 14px 0; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255,255,255,.1); min-height: 56px; flex-shrink: 0; }
.sb-logo-icon { width: 32px; height: 32px; background: var(--g400); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 12px; }
.sb-logo-text { margin-left: 10px; opacity: 0; transition: opacity .2s; white-space: nowrap; }
.sidebar:hover .sb-logo-text { opacity: 1; }
.sb-logo-title { font-size: 13px; font-weight: 700; color: #fff; }
.sb-logo-sub   { font-size: 10px; color: var(--g200); margin-top: 1px; }
.sb-nav { padding: 12px 0; flex: 1; width: 100%; }
.sb-item { width: 100%; display: flex; align-items: center; padding: 10px 0 10px 15px; cursor: pointer; transition: background .15s; position: relative; white-space: nowrap; }
.sb-item:hover  { background: rgba(255,255,255,.08); }
.sb-item.active { background: rgba(255,255,255,.12); }
.sb-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--g300); border-radius: 0 2px 2px 0; }
.sb-icon  { font-size: 18px; flex-shrink: 0; width: 26px; text-align: center; }
.sb-label { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.7); margin-left: 12px; opacity: 0; transition: opacity .2s; }
.sidebar:hover .sb-label { opacity: 1; }
.sb-item.active .sb-label { color: #fff; }
.sb-bottom { padding: 12px 0; border-top: 1px solid rgba(255,255,255,.1); width: 100%; }

/* ══ TOPBAR ══ */
.topbar { position: fixed; top: 0; left: var(--sidebar-w); right: 0; height: 56px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 12px; z-index: 100; box-shadow: var(--sh); }
.topbar-tabs { display: flex; align-items: center; gap: 2px; flex: 1; }
.top-tab { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--txt3); cursor: pointer; transition: all .15s; border: 1.5px solid transparent; white-space: nowrap; }
.top-tab:hover  { background: var(--g50); color: var(--txt2); }
.top-tab.active { background: var(--g50); color: var(--g500); border-color: var(--g200); }
.top-tab-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.tb-time { font-size: 11px; color: var(--txt3); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
.tb-refresh { width: 32px; height: 32px; border: 1px solid var(--border2); border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; transition: background .15s, transform .3s; background: var(--white); }
.tb-refresh:hover { background: var(--g50); }
.tb-refresh.spinning { animation: spin .7s linear infinite; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g400); animation: lpulse 2.5s ease-in-out infinite; }
@keyframes lpulse { 0%,100%{ box-shadow:0 0 0 0 rgba(58,153,102,.4); } 50%{ box-shadow:0 0 0 4px rgba(58,153,102,0); } }

/* ══ MAIN ══ */
.main { margin-left: var(--sidebar-w); margin-top: 56px; flex: 1; padding: 20px; min-height: calc(100vh - 56px); }

/* ══ SECTION ══ */
.sec-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sec-title { font-size: 12px; font-weight: 600; color: var(--txt2); display: flex; align-items: center; gap: 6px; }

/* ══ KPI ROW ══ */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--rl); padding: 16px 18px; box-shadow: var(--sh); cursor: default; transition: box-shadow .2s; position: relative; overflow: hidden; animation: fadeup .4s ease both; }
.kpi-card:hover { box-shadow: var(--shm); }
.kpi-card.accent { background: linear-gradient(135deg, var(--g700) 0%, var(--g500) 100%); border-color: var(--g500); }
.kpi-card.accent * { color: #fff !important; }
.kpi-card.accent .kpi-sub    { color: var(--g200) !important; }
.kpi-card.accent .kpi-target { color: var(--g200) !important; }
.kpi-top    { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.kpi-label  { font-size: 11px; font-weight: 500; color: var(--txt3); }
.kpi-amount { font-size: 32px; font-weight: 700; line-height: 1; letter-spacing: -1.5px; color: var(--txt); }
.kpi-amount.green  { color: var(--g500); }
.kpi-amount.orange { color: var(--gold); }
.kpi-amount.white  { color: #fff; }
.kpi-sub    { font-size: 11px; color: var(--txt3); margin-top: 4px; }
.kpi-target { font-size: 10px; color: var(--txt3); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
@keyframes fadeup { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
.kpi-card:nth-child(1){ animation-delay:.04s; }
.kpi-card:nth-child(2){ animation-delay:.08s; }
.kpi-card:nth-child(3){ animation-delay:.12s; }
.kpi-card:nth-child(4){ animation-delay:.16s; }

/* ══ WIDGET GRID ══ */
.widget-grid   { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 12px; margin-bottom: 12px; }
.widget-grid-2 { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }

/* ══ WIDGET ══ */
.widget { background: var(--white); border: 1px solid var(--border); border-radius: var(--rl); box-shadow: var(--sh); overflow: hidden; animation: fadeup .5s ease both; }
.widget-hdr { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.w-title { font-size: 12px; font-weight: 600; color: var(--txt); display: flex; align-items: center; gap: 6px; }
.w-icon  { font-size: 13px; }
.widget-body        { padding: 14px 16px; }
.widget-body.no-pad { padding: 0; }
.chart-wrap { position: relative; width: 100%; }

/* ══ DONUT ══ */
.donut-wrap { display: flex; align-items: center; gap: 20px; padding: 8px 0; }
.donut-canvas-wrap { position: relative; flex-shrink: 0; }
.donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
.donut-val  { font-size: 22px; font-weight: 700; color: var(--txt); line-height: 1; }
.donut-unit { font-size: 10px; color: var(--txt3); margin-top: 2px; }
.donut-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.dl-item { display: flex; align-items: center; gap: 8px; }
.dl-dot  { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.dl-name { font-size: 11px; color: var(--txt2); flex: 1; }
.dl-val  { font-size: 12px; font-weight: 600; color: var(--txt); font-family: 'JetBrains Mono', monospace; }

/* ══ RANK LIST ══ */
.rank-list { display: flex; flex-direction: column; }
.rank-item { display: flex; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--border); gap: 10px; transition: background .12s; }
.rank-item:last-child { border-bottom: none; }
.rank-item:hover { background: var(--g50); }
.rank-num    { font-size: 11px; color: var(--txt3); min-width: 18px; font-weight: 600; }
.rank-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--g100); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.rank-name   { font-size: 12px; font-weight: 500; color: var(--txt); flex: 1; }
.rank-pct    { font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.rank-pct.g { color: var(--g500); }
.rank-pct.a { color: var(--gold); }
.rank-pct.r { color: var(--red); }

/* ══ PROGRESS INLINE ══ */
.pi-wrap  { display: flex; align-items: center; gap: 8px; }
.pi-track { flex: 1; height: 4px; background: var(--g100); border-radius: 2px; overflow: hidden; }
.pi-fill  { height: 100%; border-radius: 2px; }
.pi-lbl   { font-size: 11px; font-weight: 600; min-width: 38px; text-align: right; font-family: 'JetBrains Mono', monospace; }

/* ══ TABLE ══ */
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th { text-align: left; padding: 10px 14px; font-size: 10px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: .6px; border-bottom: 1px solid var(--border); background: var(--bg); white-space: nowrap; }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--txt2); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--g50); }
.total-row td { background: var(--g50) !important; font-weight: 600; color: var(--txt); border-top: 2px solid var(--g100) !important; }
.tc-name { font-weight: 600; color: var(--txt) !important; }
.tc-num  { font-family: 'JetBrains Mono', monospace; font-size: 11px; }

/* ══ BADGES ══ */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
.bg { background: var(--g100); color: var(--g500); }
.ba { background: #FEF0E0; color: #B06820; }
.br { background: #FCEAEA; color: #B03030; }

/* ══ TABS ══ */
.wtabs { display: flex; padding: 0 16px; border-bottom: 1px solid var(--border); gap: 0; }
.wtab-btn { padding: 10px 14px; font-size: 11px; font-weight: 600; color: var(--txt3); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s; font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: .5px; }
.wtab-btn.active { color: var(--g500); border-bottom-color: var(--g400); }
.wtab-btn:hover  { color: var(--txt); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ══ ALERT BAND ══ */
.alert-band { background: var(--white); border: 1px solid var(--border); border-radius: var(--rl); padding: 10px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: var(--sh); }
.ab-chip { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--txt2); white-space: nowrap; }
.ab-chip strong { color: var(--txt); font-weight: 600; }
.ab-sep { color: var(--border2); }

/* ══ ERROR BOX ══ */
.err-box { background: #FCEAEA; border: 1px solid #F0BABA; border-radius: var(--r); padding: 1rem 1.25rem; color: #922020; font-size: 13px; margin: 1rem; }
.err-box code { font-family: 'JetBrains Mono', monospace; font-size: 11px; display: block; margin-top: 6px; opacity: .8; word-break: break-all; }

/* ══ STATES ══ */
.state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 2rem; gap: 1rem; text-align: center; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--g100); border-top-color: var(--g400); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.state-msg { font-size: 12px; color: var(--txt3); }

/* ══ SCROLLBAR ══ */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ══ RESPONSIVE ══ */
@media(max-width:1100px){ .kpi-row { grid-template-columns: repeat(2,1fr); } .widget-grid, .widget-grid-2 { grid-template-columns: 1fr 1fr; } }
@media(max-width:700px)  { .kpi-row { grid-template-columns: 1fr 1fr; } .widget-grid, .widget-grid-2 { grid-template-columns: 1fr; } .main { padding: 12px; } .topbar-tabs { display: none; } }
</style>
</head>

<aside class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 20V8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>

        <circle cx="15" cy="15" r="1.4" fill="#F0C84A"/>
      </svg>
    </div>
    <div class="sb-logo-text">

    <div class="sb-item active"><span class="sb-icon">📊</span><span class="sb-label">Asosiy panel</span></div>

    <div class="sb-item" onclick="scrollToEl('rankWrap')"><span class="sb-icon">🏆</span><span class="sb-label">Reyting</span></div>

  </nav>

  </div>

<!-- ══ TOPBAR ══ -->
<header class="topbar">
  <div class="topbar-tabs">
    <div class="top-tab active">
      <div class="top-tab-dot" style="background:var(--g400)"></div>
      <span id="tabMavsum">Kuzgi 2025–2026</span>
    </div>
    <div class="top-tab">
      <div class="top-tab-dot" style="background:var(--gold)"></div>
      <span>Umumiy svodka</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="tb-time" id="tbTime">—</span>
    <div class="tb-refresh" id="refreshBtn" onclick="loadData()" title="Yangilash">↻</div>
    <div class="live-dot" title="Jonli — har 5 daqiqada yangilanadi"></div>
  </div>
</header>

<main class="main">
  <div id="appRoot">
    <div class="state">
      <div class="spinner"></div>
      <div class="state-msg">Ma'lumotlar yuklanmoqda...</div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ╔══════════════════════════════════════════════════╗
// ║   GITHUB SOZLAMALARI — FAQAT SHUНИ O'ZGARTIRING ║
// ╚══════════════════════════════════════════════════╝
const CONFIG = {
  owner:  'azimjonrisqiboyev-ux',   // <-- o'z GitHub username ingiz
  repo:   'galla-svodka',           // <-- repository nomi
  branch: 'main',
  file:   'data/data.json'          // <-- bot yuklayotgan fayl
};
// ═══════════════════════════════════════════════════

let _charts = {};

function destroyCharts(){
  Object.values(_charts).forEach(c => c && c.destroy && c.destroy());
  _charts = {};
}

// ── ASOSIY YUKLASH FUNKSIYASI ──────────────────────
async function loadData(){
  destroyCharts();
  document.getElementById('appRoot').innerHTML =
    '<div class="state"><div class="spinner"></div><div class="state-msg">Ma\'lumotlar yuklanmoqda...</div></div>';

  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');

  // ⭐ CACHE BUSTING — har safar GitHub dan yangi ma'lumot oladi
  const url = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${CONFIG.file}?t=${Date.now()}`;

  try {
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP ${res.status} — ${CONFIG.file} topilmadi`);
    const raw = await res.json();

    // Bot yuklagan JSON ni dashboard formatiga o'tkazish
    const data = parseRawJSON(raw);
    document.getElementById('tbTime').textContent = '🕐 ' + new Date().toLocaleTimeString('uz');
    renderDash(data);

  } catch(e) {
    document.getElementById('appRoot').innerHTML = `
      <div class="err-box">
        ❌ <strong>Ma'lumot yuklanmadi</strong>
        <code>${e.message}</code>
        <br><br>
        Tekshiring:<br>
        • GitHub repository <strong>public (ochiq)</strong> bo'lishi kerak<br>
        • <code>${CONFIG.file}</code> fayli mavjud bo'lishi kerak<br>
        • <code>CONFIG.owner</code> to'g'ri GitHub username bo'lishi kerak<br>
        <code style="margin-top:8px;opacity:.6">${url.split('?')[0]}</code>
      </div>`;
  } finally {
    btn.classList.remove('spinning');
  }
}

// ── BOT YUKLAGAN JSON NI DASHBOARD FORMATIGA O'TKAZISH ──
function parseRawJSON(raw) {
  // Agar allaqachon to'g'ri formatda bo'lsa
  if(raw.meta && raw.umumiy) return raw;

  // Bot Excel dan o'girgan raw formatni parse qilish
  // Sheet nomlari: "1 ж", "2 ж", "Қўшимча", "Жами"
  const sheet1    = raw['1 ж']  || null;
  const sheetJami = raw['Жами'] || null;

  if(!sheet1) {
    // Birinchi arrayni olish
    const firstKey = Object.keys(raw)[0];
    const arr = Array.isArray(raw) ? raw : (raw[firstKey] || []);
    return {
      meta: { sana: new Date().toISOString().slice(0,10), mavsum: "Kuzgi 2025-2026", viloyat: "Toshkent viloyati" },
      umumiy: buildUmumiy(arr),
      jami: []
    };
  }

  // Sana topish
  let sana = new Date().toISOString().slice(0,10);
  try {
    const firstVals = Object.values(sheet1[0] || {});
    for(const v of firstVals){
      if(typeof v === 'string' && v.includes('йил')){
        const m = v.match(/(\d{4})\s*йил\s*(\d+)\s*([\wА-Яа-яЎўҚқҒғҲҳ]+)/);
        if(m) { sana = `${m[1]}-${String(m[2]).padStart(2,'0')}`; break; }
      }
    }
  } catch(_){}

  return {
    meta: { sana, mavsum: "Kuzgi 2025-2026", viloyat: "Toshkent viloyati" },
    umumiy: buildUmumiy(sheet1),
    jami:   sheetJami ? buildJami(sheetJami) : []
  };
}

function buildUmumiy(rows) {
  const res = [];
  for(const row of rows){
    const v = Object.values(row);
    const num = v[0];
    if(typeof num !== 'number' || num < 1 || num > 20) continue;
    res.push({
      tuman:   String(v[1]||'').trim(),
      reja:    +parseFloat(v[2]||0).toFixed(2),
      ekish_f: +parseFloat(v[10]||0).toFixed(3),  // ekish mavsum %
      sug_f:   +parseFloat(v[14]||0).toFixed(3),  // sug'orish mavsum %
      unib_ga: +parseFloat(v[15]||0).toFixed(2),
      unib_f:  +parseFloat(v[16]||0).toFixed(3),
    });
  }
  return res;
}

function buildJami(rows) {
  const res = [];
  for(const row of rows){
    const v = Object.values(row);
    const num = v[0];
    if(typeof num !== 'number' || num < 1 || num > 20) continue;
    res.push({
      tuman:    String(v[1]||'').trim(),
      reja:     +parseFloat(v[2]||0).toFixed(2),
      suvli_ga: +parseFloat(v[6]||0).toFixed(2),
      suvli_f:  +parseFloat(v[7]||0).toFixed(3),
      lalmi_ga: +parseFloat(v[11]||0).toFixed(2),
      lalmi_f:  +parseFloat(v[12]||0).toFixed(3),
    });
  }
  return res;
}

// ── HELPERS ──────────────────────────────────────
function pColor(v){ return v>=95?'#3A9966':v>=80?'#E8963A':'#DC4C4C'; }
function badge(v){ const c=v>=95?'bg':v>=80?'ba':'br'; return `<span class="badge ${c}">${v.toFixed(1)}%</span>`; }
function pi(v){
  const f=Math.min(v,100), col=pColor(v);
  return `<div class="pi-wrap"><div class="pi-track"><div class="pi-fill" style="width:${f}%;background:${col}"></div></div><span class="pi-lbl" style="color:${col}">${v.toFixed(1)}%</span></div>`;
}
function n(v){ return Math.round(v).toLocaleString('ru'); }
function sn(s){ return s.replace('чирчиқ','чирч.').replace('Бустонлиқ','Бустонл.'); }
function emoji(v){ return v>=95?'🟢':v>=80?'🟡':'🔴'; }

        <div class="kpi-amount green">${avgE.toFixed(1)}%</div>

        <div class="kpi-target">Maqsad: 100%</div>
      </div>
      <div class="kpi-card accent">
        <div class="kpi-top"><div class="kpi-label">Unib chiqqan maydon</div></div>
        <div class="kpi-amount white">${n(totUnib)} ha</div>

        <div class="kpi-amount ${avgS>=95?'green':'orange'}">${avgS.toFixed(1)}%</div>

        <div class="kpi-target">Maqsad: ≥ 95%</div>

    <!-- WIDGETS ROW 1 -->
    <div class="widget-grid" id="widgetsTop">
      <div class="widget">
        <div class="widget-hdr"><div class="w-title"><span class="w-icon">📈</span>Hosil prognoz — unib chiqish</div></div>
        <div class="widget-body">

  `;

  // Rank list
  const rl = document.getElementById('rankList');
  sorted.slice(0,7).forEach((r,i)=>{
    const cls = r.unib_f>=95?'g':r.unib_f>=80?'a':'r';

      wl.innerHTML += `

          <div class="rank-avatar">⚠️</div>
          <div style="flex:1">
            <div style="font-size:12px;font-weight:600;color:var(--txt)">${sn(r.tuman)}</div>
            <div style="font-size:10px;color:var(--txt3);margin-top:2px;font-family:'JetBrains Mono',monospace">Sug: ${r.sug_f.toFixed(1)}% · Unib: ${r.unib_f.toFixed(1)}%</div>

  }

  buildCharts(data, sorted);
}

// ── CHARTS ────────────────────────────────────────
function buildCharts(data, sorted){
  const d = data.umumiy;
  const labels = d.map(r=>sn(r.tuman));
  const unib   = d.map(r=>r.unib_f);
  const ekish  = d.map(r=>Math.min(r.ekish_f,100));
  const sug    = d.map(r=>Math.min(r.sug_f,100));
  const tick   = {color:'#7A9A8A', font:{size:10, family:'Inter'}};
  const grid   = {color:'rgba(0,0,0,.04)'};

  // Stacked bar: forecast
  _charts.forecast = new Chart(document.getElementById('cForecast'),{
    type:'bar',
    data:{ labels, datasets:[
      {label:'Unib chiqdi', data:d.map(r=>r.unib_ga), backgroundColor:'#3A9966', borderRadius:3, borderSkipped:false},
      {label:'Hali unimagan', data:d.map(r=>Math.max(0,r.reja-r.unib_ga)), backgroundColor:'#D4EFE2', borderRadius:3, borderSkipped:false},
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${n(c.parsed.y)} ha`}}},
      scales:{ x:{stacked:true,ticks:{...tick,maxRotation:40},grid:{display:false}}, y:{stacked:true,ticks:{...tick,callback:v=>n(v)},grid} }
    }
  });

  // Donut
  const good = d.filter(r=>r.unib_f>=95).length;
  const mid  = d.filter(r=>r.unib_f>=80&&r.unib_f<95).length;
  const bad  = d.filter(r=>r.unib_f<80).length;
  _charts.donut = new Chart(document.getElementById('cDonut'),{
    type:'doughnut',
    data:{ labels:['Yaxshi (≥95%)','Oʻrta (80–94%)','Kuzatish (<80%)'],
      datasets:[{data:[good,mid,bad], backgroundColor:['#3A9966','#E8963A','#DC4C4C'], borderColor:'#fff', borderWidth:3, hoverOffset:5}]
    },
    options:{ responsive:false, cutout:'62%',
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.label}: ${c.parsed} ta tuman`}}}
    }
  });

  // Line chart
  _charts.line = new Chart(document.getElementById('cLine'),{
    type:'line',
    data:{ labels, datasets:[
      {label:'Ekish %',     data:ekish, borderColor:'#3A9966', backgroundColor:'rgba(58,153,102,.08)', fill:true, tension:.4, pointRadius:2.5, pointBackgroundColor:'#3A9966', borderWidth:2},
      {label:"Sugʻorish %", data:sug,   borderColor:'#3A7BD5', backgroundColor:'rgba(58,123,213,.06)', fill:true, tension:.4, pointRadius:2.5, pointBackgroundColor:'#3A7BD5', borderWidth:2},
    ]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{ x:{ticks:{...tick,maxRotation:40},grid:{display:false}}, y:{min:50,max:105,ticks:{...tick,callback:v=>v+'%'},grid} }
    }
  });

  // Horizontal pipeline bar
  if(data.jami && data.jami.length > 0){
    const jl = data.jami.slice(0,8);
    _charts.pipe = new Chart(document.getElementById('cPipe'),{
      type:'bar',
      data:{ labels:jl.map(r=>sn(r.tuman)), datasets:[
        {label:'Suvli (ha)', data:jl.map(r=>r.suvli_ga), backgroundColor:'#3A9966', borderRadius:3, borderSkipped:false},
        {label:'Lalmi (ha)', data:jl.map(r=>r.lalmi_ga), backgroundColor:'#A8D9BC', borderRadius:3, borderSkipped:false},
      ]},
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:true, labels:{font:{size:10,family:'Inter'}, color:'#7A9A8A', boxWidth:10}}},
        scales:{ x:{ticks:{...tick,callback:v=>n(v)},grid}, y:{ticks:{...tick},grid:{display:false}} }
      }
    });
  }
}

function switchTab(btn,id){
  btn.closest('.widget').querySelectorAll('.wtab-btn').forEach(b=>b.classList.remove('active'));
  btn.closest('.widget').querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(id).classList.add('active');
}

function scrollToEl(id){
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── AUTO REFRESH: har 5 daqiqada ─────────────────
setInterval(loadData, 5 * 60 * 1000);

// ── INIT ─────────────────────────────────────────
loadData();
</script>
